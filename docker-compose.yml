services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - PORT=3000
      - DEFAULT_BALANCE=100000
      - LOG_LEVEL=info
      - EXTRA_DEXS=${EXTRA_DEXS:-xyz}
      - EXTRA_DEX_CTX_REFRESH_MS=${EXTRA_DEX_CTX_REFRESH_MS:-15000}
      - PNL_SNAPSHOT_ENABLED=${PNL_SNAPSHOT_ENABLED:-false}
      - FUNDING_ENABLED=${FUNDING_ENABLED:?set FUNDING_ENABLED explicitly}
      - FUNDING_INTERVAL_MS=${FUNDING_INTERVAL_MS:?set FUNDING_INTERVAL_MS explicitly}
      - FUNDING_APPLY_DELAY_MS=${FUNDING_APPLY_DELAY_MS:-30000}
      - FUNDING_MAX_LATE_MS=${FUNDING_MAX_LATE_MS:-55000}
      - FUNDING_RETRY_MS=${FUNDING_RETRY_MS:-5000}
    restart: unless-stopped
    profiles:
      - prod

volumes:
  redis-data:
